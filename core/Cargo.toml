[package]
name = "durastream-core"
version = "0.0.0"                # not used: the Python version lives in ../pyproject.toml
edition = "2024"
rust-version = "1.89"            # File::try_lock
publish = false                  # ships inside the durastream wheel
description = "Rust engine for durastream: tiny durable streaming on local disk"
license = "MIT"
repository = "https://github.com/terminalkitten/durastream"

[lib]
name = "durastream_core"
crate-type = ["rlib", "cdylib"]

[features]
python = ["dep:pyo3"]

[dependencies]
crc-fast = "1.10"
libc = "0.2"
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py312"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = "2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = true
codegen-units = 1
