name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: make lint # ty, ruff check + format

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12", "3.14"] # oldest supported + newest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv run pytest -q # same as make test (make isn't on Windows runners)
      - if: runner.os == 'Linux'
        name: disk-full rollback (real ENOSPC on a 1 MiB tmpfs)
        run: |
          sudo mkdir -p /mnt/small
          sudo mount -t tmpfs -o size=1m tmpfs /mnt/small
          sudo chmod 1777 /mnt/small
          DURASTREAM_SMALL_FS=/mnt/small uv run pytest -q tests/test_disk_full.py
