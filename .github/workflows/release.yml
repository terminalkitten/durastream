# Release durastream: bump `version` in pyproject.toml, then push tag v<version>.
# Builds the wheel and sdist, tests the wheel on Linux, macOS and Windows, then
# publishes to PyPI.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tag matches pyproject.toml
        run: |
          v=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          echo "tag=$GITHUB_REF_NAME pyproject=$v"
          test "$GITHUB_REF_NAME" = "v$v"
      - uses: astral-sh/setup-uv@v6
      - run: uv build --out-dir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # install the built wheel (not the source tree) and run the test suite
  test-wheel:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4 # for tests/
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv venv && uv pip install pytest pytest-asyncio dist/*.whl
      - run: uv run --no-project -p .venv python -m pytest -q tests

  publish:
    needs: test-wheel
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
