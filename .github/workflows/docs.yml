# Docs: build the dokk site from docs/ and publish it to GitHub Pages on every push to main that
# touches it (Settings > Pages > Source: GitHub Actions).
name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "public/**"
      - "templates/**"
      - "dokk.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for "last updated" dates
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install "dokk[search]==0.0.3"  # pinned: bump when you upgrade dokk
      - run: dokk check
      - run: dokk build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .dokk/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
