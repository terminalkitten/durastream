[project]
name = "durastream"
version = "0.0.1a3" # single source of truth; release tag must be v<version>
description = "Tiny durable streaming on local disk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/durastream"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitignore",
    "/.python-version",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
    "/src",
]
exclude = ["/tests", "/demos", "/scripts"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
