[project]
name = "durastream"
dynamic = ["version"]
description = "Tiny durable streaming on local disk"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { version_scheme = "no-guess-dev", fallback_version = "0.0.0" }

[tool.hatch.build.targets.wheel]
packages = ["src/durastream"]

[tool.hatch.build.targets.sdist]
include = [
    "/.gitignore", 
    "/.python-version", 
    "/pyproject.toml", 
    "/uv.lock", 
    "/README.md", 
    "/LICENSE",
    "/src"
]
exclude = ["/tests", "/demos"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
