[project]
name = "durastream"
version = "0.0.1a3" # single source of truth; release tag must be v<version>
description = "Tiny durable streaming on local disk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

# Platform wheels (Linux, macOS) embed the native (Rust) engine as durastream.core.
# A py3-none-any wheel (built with hatchling, see Makefile `build`) is the
# pure-Python fallback for everything else (Windows, PyPy, ...).
[build-system]
requires = ["maturin>=1.8,<2"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "core/Cargo.toml"
python-source = "src"
module-name = "durastream.core"
features = ["python"]

# pure-Python fallback wheel only
[tool.hatch.build.targets.wheel]
packages = ["src/durastream"]
exclude = ["*.so", "*.pyd", "src/durastream/core.pyi"]

[dependency-groups]
dev = [
    "ruff>=0.16.4",
    "ty>=0.0.74",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.uv]
# rebuild the Rust extension on `uv sync` / `uv run` when Rust sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "core/Cargo.toml" }, { file = "core/src/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
